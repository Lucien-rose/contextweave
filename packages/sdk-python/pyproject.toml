[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextweave-sdk"
version = "0.1.0"
description = "Typed sync and async clients for ContextWeave HTTP API v1"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.28,<1"]
classifiers = ["Development Status :: 3 - Alpha", "Typing :: Typed", "Private :: Do Not Upload"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextweave = ["py.typed"]

[tool.mypy]
strict = true
files = ["src/contextweave", "tests/consumer.py"]
