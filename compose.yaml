services:
  contextweave:
    build: .
    image: contextweave:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MOSS_HTTP_PORT:-2091}:2091"
    volumes:
      - moss-data:/app/data
      - ./imports:/imports:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  moss-data:
